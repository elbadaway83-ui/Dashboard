<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول — Elawaady</title>
  <link rel="icon" href="./assets/img/favicon_1775018842_4158.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --brand: #6366f1;
      --brand-dark: #4f46e5;
      --brand-light: #eef2ff;
      --surface: #ffffff;
      --surface-2: #f8fafc;
      --border: #e2e8f0;
      --text-1: #0f172a;
      --text-2: #475569;
      --text-3: #94a3b8;
      --red: #ef4444;
      --red-light: #fef2f2;
      --green: #22c55e;
      --green-light: #f0fdf4;
      --radius: 14px;
      --shadow: 0 20px 60px rgba(99,102,241,.15), 0 4px 16px rgba(0,0,0,.08);
    }

    body {
      font-family: 'Cairo', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
      overflow: hidden;
    }

    /* خلفية ديكور */
    body::before {
      content: '';
      position: fixed;
      top: -200px; left: -200px;
      width: 600px; height: 600px;
      background: rgba(255,255,255,.06);
      border-radius: 50%;
      pointer-events: none;
    }
    body::after {
      content: '';
      position: fixed;
      bottom: -150px; right: -150px;
      width: 500px; height: 500px;
      background: rgba(255,255,255,.04);
      border-radius: 50%;
      pointer-events: none;
    }

    /* بطاقة تسجيل الدخول */
    .login-card {
      background: var(--surface);
      border-radius: 24px;
      padding: 44px 40px;
      width: 100%;
      max-width: 440px;
      box-shadow: var(--shadow);
      animation: slideUp .45s cubic-bezier(.34,1.56,.64,1);
      position: relative;
      z-index: 1;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(32px) scale(.97); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* اللوجو */
    .login-logo {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 28px;
    }

    .logo-icon {
      width: 48px; height: 48px;
      background: linear-gradient(135deg, var(--brand), #8b5cf6);
      border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      font-size: 22px; color: white;
      box-shadow: 0 8px 20px rgba(99,102,241,.35);
    }

    .logo-text {
      font-size: 22px; font-weight: 900; color: var(--text-1);
    }
    .logo-text span { color: var(--brand); }

    /* العنوان */
    .login-title {
      text-align: center;
      font-size: 20px; font-weight: 800; color: var(--text-1);
      margin-bottom: 4px;
    }
    .login-subtitle {
      text-align: center;
      font-size: 13.5px; color: var(--text-3);
      margin-bottom: 30px;
    }

    /* رسالة الخطأ */
    .error-box {
      display: none;
      background: var(--red-light);
      border: 1px solid #fecaca;
      border-radius: 10px;
      padding: 11px 14px;
      font-size: 13px; color: var(--red);
      margin-bottom: 18px;
      gap: 8px; align-items: center;
    }
    .error-box.show { display: flex; animation: shake .4s; }
    @keyframes shake {
      0%,100%{transform:translateX(0)}
      20%{transform:translateX(-6px)}
      40%{transform:translateX(6px)}
      60%{transform:translateX(-4px)}
      80%{transform:translateX(4px)}
    }

    /* رسالة نجاح */
    .success-box {
      display: none;
      background: var(--green-light);
      border: 1px solid #bbf7d0;
      border-radius: 10px;
      padding: 11px 14px;
      font-size: 13px; color: #15803d;
      margin-bottom: 18px;
      gap: 8px; align-items: center;
    }
    .success-box.show { display: flex; }

    /* الفورم */
    .form-group { margin-bottom: 18px; }

    .form-label {
      display: block;
      font-size: 13px; font-weight: 700; color: var(--text-2);
      margin-bottom: 7px;
    }

    .input-wrap {
      position: relative;
    }
    .input-wrap .input-icon {
      position: absolute;
      right: 14px; top: 50%; transform: translateY(-50%);
      color: var(--text-3); font-size: 15px;
      pointer-events: none;
    }
    .input-wrap .toggle-pass {
      position: absolute;
      left: 14px; top: 50%; transform: translateY(-50%);
      color: var(--text-3); font-size: 15px;
      cursor: pointer; background: none; border: none; padding: 0;
      transition: color .2s;
    }
    .input-wrap .toggle-pass:hover { color: var(--brand); }

    .form-input {
      width: 100%;
      padding: 12px 42px 12px 42px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      font-family: 'Cairo', sans-serif;
      font-size: 14px; color: var(--text-1);
      background: var(--surface-2);
      transition: border-color .2s, box-shadow .2s, background .2s;
      outline: none;
    }
    .form-input:focus {
      border-color: var(--brand);
      background: white;
      box-shadow: 0 0 0 3px rgba(99,102,241,.12);
    }
    .form-input::placeholder { color: var(--text-3); }
    .form-input.is-invalid { border-color: var(--red); box-shadow: 0 0 0 3px rgba(239,68,68,.1); }

    /* صف التذكر/النسيان */
    .form-row {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 22px; font-size: 13px;
    }
    .remember-label {
      display: flex; align-items: center; gap: 7px;
      color: var(--text-2); cursor: pointer;
    }
    .remember-label input[type="checkbox"] {
      accent-color: var(--brand); width: 15px; height: 15px;
    }
    .forgot-link {
      color: var(--brand); font-weight: 600; cursor: pointer; text-decoration: none;
      transition: opacity .2s;
    }
    .forgot-link:hover { opacity: .75; text-decoration: underline; }

    /* زرار الدخول */
    .btn-login {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, var(--brand), var(--brand-dark));
      border: none; border-radius: 12px;
      color: white; font-family: 'Cairo', sans-serif;
      font-size: 15px; font-weight: 800;
      cursor: pointer;
      transition: transform .15s, box-shadow .15s, opacity .15s;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      position: relative; overflow: hidden;
    }
    .btn-login:hover { transform: translateY(-2px); box-shadow: 0 10px 28px rgba(99,102,241,.4); }
    .btn-login:active { transform: translateY(0); }
    .btn-login:disabled { opacity: .7; cursor: not-allowed; transform: none; }

    /* spinner */
    .spinner {
      display: none;
      width: 18px; height: 18px;
      border: 2px solid rgba(255,255,255,.4);
      border-top-color: white;
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* الفاصل */
    .divider {
      display: flex; align-items: center; gap: 12px;
      margin: 22px 0; color: var(--text-3); font-size: 12px;
    }
    .divider::before, .divider::after {
      content: ''; flex: 1; height: 1px; background: var(--border);
    }

    /* معلومات إضافية */
    .login-footer {
      text-align: center;
      font-size: 12px; color: var(--text-3);
      margin-top: 20px; line-height: 1.6;
    }

    /* بطاقة المعلومات التجريبية */
    .demo-hint {
      background: var(--brand-light);
      border: 1px solid #c7d2fe;
      border-radius: 10px;
      padding: 11px 14px;
      font-size: 12.5px; color: #4338ca;
      margin-bottom: 20px;
      display: flex; align-items: flex-start; gap: 8px;
    }
    .demo-hint i { margin-top: 1px; flex-shrink: 0; }
    .demo-hint code {
      background: rgba(99,102,241,.12);
      padding: 1px 5px; border-radius: 4px; font-size: 11.5px;
      font-family: monospace; color: var(--brand);
    }

    /* شريط الأمان الأسفل */
    .security-bar {
      display: flex; align-items: center; justify-content: center;
      gap: 6px; font-size: 11.5px; color: var(--text-3);
      margin-top: 16px;
    }
  </style>
</head>
<body>

<div class="login-card">

  <!-- اللوجو -->
  <div class="login-logo">
    <div class="logo-icon"><i class="bi bi-controller"></i></div>
    <div class="logo-text">El<span>awaady</span></div>
  </div>

  <div class="login-title">تسجيل الدخول إلى لوحة التحكم</div>
  <div class="login-subtitle">أدخل بيانات حسابك للمتابعة</div>

  <!-- تلميح تجريبي -->
  <div class="demo-hint">
    <i class="bi bi-info-circle-fill"></i>
    <div>
      بيانات الدخول: البريد <code>admin@elawaady.com</code>
      كلمة المرور <code>123456</code>
    </div>
  </div>

  <!-- رسالة الخطأ -->
  <div class="error-box" id="errorBox">
    <i class="bi bi-exclamation-circle-fill"></i>
    <span id="errorMsg">بيانات غير صحيحة</span>
  </div>

  <!-- رسالة النجاح -->
  <div class="success-box" id="successBox">
    <i class="bi bi-check-circle-fill"></i>
    <span>تم تسجيل الدخول بنجاح! جاري التحويل...</span>
  </div>

  <!-- الفورم -->
  <div class="form-group">
    <label class="form-label" for="emailInput">البريد الإلكتروني</label>
    <div class="input-wrap">
      <i class="bi bi-envelope input-icon"></i>
      <input
        type="email"
        class="form-input"
        id="emailInput"
        placeholder="admin@elawaady.com"
        autocomplete="email"
        dir="ltr"
      >
    </div>
  </div>

  <div class="form-group">
    <label class="form-label" for="passwordInput">كلمة المرور</label>
    <div class="input-wrap">
      <i class="bi bi-lock input-icon"></i>
      <input
        type="password"
        class="form-input"
        id="passwordInput"
        placeholder="••••••••"
        autocomplete="current-password"
        dir="ltr"
      >
      <button class="toggle-pass" id="togglePass" type="button" tabindex="-1">
        <i class="bi bi-eye" id="togglePassIcon"></i>
      </button>
    </div>
  </div>

  <div class="form-row">
    <label class="remember-label">
      <input type="checkbox" id="rememberMe"> تذكرني
    </label>
    <a href="#" class="forgot-link" onclick="handleForgot(event)">نسيت كلمة المرور؟</a>
  </div>

  <button class="btn-login" id="loginBtn" onclick="handleLogin()">
    <div class="spinner" id="loginSpinner"></div>
    <i class="bi bi-box-arrow-in-right" id="loginIcon"></i>
    <span id="loginText">دخول</span>
  </button>

  <!-- شريط الأمان -->
  <div class="security-bar">
    <i class="bi bi-shield-lock-fill text-success"></i>
    اتصال مشفر وآمن — SSL/HTTPS
  </div>

  <div class="login-footer">
    &copy; 2026 Elawaady · جميع الحقوق محفوظة
  </div>

</div>

<script>
  // ── بيانات الدخول المسموح بها (مثال — على الخادم يكون التحقق backend) ──
  const VALID_USERS = [
    { email: 'admin@elawaady.com', password: '123456' },
    { email: 'elawaady@admin.com', password: 'admin123' },
  ];

  // ── إظهار/إخفاء كلمة المرور ──
  document.getElementById('togglePass').addEventListener('click', function () {
    const inp = document.getElementById('passwordInput');
    const icon = document.getElementById('togglePassIcon');
    if (inp.type === 'password') {
      inp.type = 'text';
      icon.className = 'bi bi-eye-slash';
    } else {
      inp.type = 'password';
      icon.className = 'bi bi-eye';
    }
  });

  // ── Enter يشغّل الدخول ──
  document.getElementById('emailInput').addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('passwordInput').focus(); });
  document.getElementById('passwordInput').addEventListener('keydown', e => { if (e.key === 'Enter') handleLogin(); });

  // ── نسيت كلمة المرور ──
  function handleForgot(e) {
    e.preventDefault();
    showError('ميزة استرجاع كلمة المرور غير متاحة حالياً، تواصل مع مسؤول النظام.');
  }

  // ── إظهار الخطأ ──
  function showError(msg) {
    const box = document.getElementById('errorBox');
    document.getElementById('errorMsg').textContent = msg;
    box.classList.remove('show');
    void box.offsetWidth; // reflow for animation
    box.classList.add('show');
    document.getElementById('emailInput').classList.add('is-invalid');
    document.getElementById('passwordInput').classList.add('is-invalid');
  }

  function clearErrors() {
    document.getElementById('errorBox').classList.remove('show');
    document.getElementById('emailInput').classList.remove('is-invalid');
    document.getElementById('passwordInput').classList.remove('is-invalid');
  }

  // ── تسجيل الدخول ──
  function handleLogin() {
    clearErrors();
    const email    = document.getElementById('emailInput').value.trim();
    const password = document.getElementById('passwordInput').value;
    const remember = document.getElementById('rememberMe').checked;

    if (!email) { showError('من فضلك أدخل البريد الإلكتروني.'); return; }
    if (!password) { showError('من فضلك أدخل كلمة المرور.'); return; }

    // تفعيل حالة التحميل
    const btn     = document.getElementById('loginBtn');
    const spinner = document.getElementById('loginSpinner');
    const icon    = document.getElementById('loginIcon');
    const text    = document.getElementById('loginText');

    btn.disabled = true;
    spinner.style.display = 'block';
    icon.style.display    = 'none';
    text.textContent      = 'جاري التحقق...';

    setTimeout(() => {
      const user = VALID_USERS.find(u => u.email === email && u.password === password);

      if (user) {
        // نجاح
        spinner.style.display = 'none';
        icon.className = 'bi bi-check-circle-fill';
        icon.style.display = 'block';
        text.textContent = 'تم الدخول!';
        btn.style.background = 'linear-gradient(135deg,#22c55e,#16a34a)';

        document.getElementById('successBox').classList.add('show');

        if (remember) {
          localStorage.setItem('elawaady_logged_in', '1');
          localStorage.setItem('elawaady_user', email);
          localStorage.setItem('elawaady_login_time', Date.now());
        } else {
          sessionStorage.setItem('elawaady_logged_in', '1');
          sessionStorage.setItem('elawaady_user', email);
          sessionStorage.setItem('elawaady_login_time', Date.now());
        }

        setTimeout(() => { window.location.href = './index.html'; }, 1200);

      } else {
        // فشل
        btn.disabled = false;
        spinner.style.display = 'none';
        icon.style.display    = 'block';
        text.textContent      = 'دخول';

        if (!VALID_USERS.find(u => u.email === email)) {
          showError('البريد الإلكتروني غير مسجل في النظام.');
        } else {
          showError('كلمة المرور غير صحيحة، حاول مرة أخرى.');
        }
      }
    }, 900);
  }

  // ── تحقق تلقائي عند تحميل الصفحة (إذا مسجل مسبقاً) ──
  window.addEventListener('DOMContentLoaded', () => {
    const logged = localStorage.getItem('elawaady_logged_in') || sessionStorage.getItem('elawaady_logged_in');
    if (logged === '1') {
      window.location.href = './index.html';
    }
    // تركيز على حقل البريد
    document.getElementById('emailInput').focus();
  });
</script>
</body>
</html>
