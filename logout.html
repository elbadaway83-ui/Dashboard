<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الخروج — Elawaady</title>
  <link rel="icon" href="./assets/img/favicon_1775018842_4158.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --brand: #6366f1;
      --red: #ef4444;
      --red-dark: #dc2626;
      --red-light: #fef2f2;
      --surface: #ffffff;
      --surface-2: #f8fafc;
      --border: #e2e8f0;
      --text-1: #0f172a;
      --text-2: #475569;
      --text-3: #94a3b8;
      --radius: 14px;
    }

    body {
      font-family: 'Cairo', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 20px;
      position: relative; overflow: hidden;
    }

    body::before {
      content: '';
      position: fixed; top: -200px; left: -200px;
      width: 600px; height: 600px;
      background: rgba(255,255,255,.06);
      border-radius: 50%; pointer-events: none;
    }
    body::after {
      content: '';
      position: fixed; bottom: -150px; right: -150px;
      width: 500px; height: 500px;
      background: rgba(255,255,255,.04);
      border-radius: 50%; pointer-events: none;
    }

    .logout-card {
      background: var(--surface);
      border-radius: 24px;
      padding: 44px 40px;
      width: 100%; max-width: 420px;
      box-shadow: 0 20px 60px rgba(99,102,241,.15), 0 4px 16px rgba(0,0,0,.08);
      animation: slideUp .45s cubic-bezier(.34,1.56,.64,1);
      position: relative; z-index: 1;
      text-align: center;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(32px) scale(.97); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* اللوجو */
    .logout-logo {
      display: flex; align-items: center; justify-content: center;
      gap: 10px; margin-bottom: 28px;
    }
    .logo-icon {
      width: 44px; height: 44px;
      background: linear-gradient(135deg, var(--brand), #8b5cf6);
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px; color: white;
    }
    .logo-text { font-size: 20px; font-weight: 900; color: var(--text-1); }
    .logo-text span { color: var(--brand); }

    /* أيقونة الخروج */
    .logout-icon-wrap {
      width: 80px; height: 80px;
      background: var(--red-light);
      border: 2px solid #fecaca;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 20px;
      font-size: 32px; color: var(--red);
      animation: pulseRed 2s ease-in-out infinite;
    }

    @keyframes pulseRed {
      0%,100% { box-shadow: 0 0 0 0 rgba(239,68,68,.25); }
      50%      { box-shadow: 0 0 0 12px rgba(239,68,68,0); }
    }

    .logout-title {
      font-size: 22px; font-weight: 900; color: var(--text-1);
      margin-bottom: 8px;
    }
    .logout-subtitle {
      font-size: 14px; color: var(--text-3); line-height: 1.7;
      margin-bottom: 28px;
    }
    .logout-subtitle strong { color: var(--text-2); }

    /* معلومات الجلسة */
    .session-info {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 18px;
      margin-bottom: 26px;
      text-align: right;
    }
    .session-row {
      display: flex; align-items: center; justify-content: space-between;
      font-size: 13px; padding: 4px 0;
    }
    .session-row:not(:last-child) { border-bottom: 1px solid var(--border); padding-bottom: 8px; margin-bottom: 8px; }
    .session-label { color: var(--text-3); display: flex; align-items: center; gap: 6px; }
    .session-val   { font-weight: 700; color: var(--text-1); }

    /* الأزرار */
    .btn-confirm {
      width: 100%; padding: 14px;
      background: linear-gradient(135deg, var(--red), var(--red-dark));
      border: none; border-radius: 12px;
      color: white; font-family: 'Cairo', sans-serif;
      font-size: 15px; font-weight: 800;
      cursor: pointer; margin-bottom: 12px;
      transition: transform .15s, box-shadow .15s;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .btn-confirm:hover { transform: translateY(-2px); box-shadow: 0 10px 28px rgba(239,68,68,.35); }
    .btn-confirm:active { transform: translateY(0); }
    .btn-confirm:disabled { opacity: .7; cursor: not-allowed; transform: none; }

    .btn-cancel {
      width: 100%; padding: 14px;
      background: transparent;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      color: var(--text-2); font-family: 'Cairo', sans-serif;
      font-size: 14px; font-weight: 700;
      cursor: pointer;
      transition: border-color .2s, color .2s, background .2s;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .btn-cancel:hover { border-color: var(--brand); color: var(--brand); background: #eef2ff; }

    /* spinner */
    .spinner {
      display: none; width: 17px; height: 17px;
      border: 2px solid rgba(255,255,255,.4);
      border-top-color: white;
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* تأكيد النجاح */
    .done-overlay {
      display: none;
      position: fixed; inset: 0;
      background: rgba(255,255,255,.95);
      z-index: 99; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 16px;
      animation: fadeIn .3s;
    }
    .done-overlay.show { display: flex; }
    @keyframes fadeIn { from{opacity:0} to{opacity:1} }
    .done-circle {
      width: 80px; height: 80px;
      background: #f0fdf4; border: 2px solid #bbf7d0;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 36px; color: #22c55e;
      animation: popIn .4s cubic-bezier(.34,1.56,.64,1);
    }
    @keyframes popIn { from{transform:scale(0)} to{transform:scale(1)} }
    .done-title { font-size: 18px; font-weight: 800; color: var(--text-1); }
    .done-sub   { font-size: 13px; color: var(--text-3); }

    .footer-note {
      font-size: 11.5px; color: var(--text-3);
      margin-top: 18px;
    }
  </style>
</head>
<body>

<!-- بطاقة الخروج -->
<div class="logout-card" id="logoutCard">

  <!-- اللوجو -->
  <div class="logout-logo">
    <div class="logo-icon"><i class="bi bi-controller"></i></div>
    <div class="logo-text">El<span>awaady</span></div>
  </div>

  <!-- أيقونة الخروج -->
  <div class="logout-icon-wrap">
    <i class="bi bi-box-arrow-left"></i>
  </div>

  <div class="logout-title">تسجيل الخروج</div>
  <div class="logout-subtitle">
    هل أنت متأكد أنك تريد الخروج يا <strong id="userName">مدير النظام</strong>؟<br>
    ستحتاج لتسجيل الدخول مرة أخرى للوصول.
  </div>

  <!-- معلومات الجلسة -->
  <div class="session-info">
    <div class="session-row">
      <span class="session-label"><i class="bi bi-person"></i>الحساب</span>
      <span class="session-val" id="sessionUser">elawaady</span>
    </div>
    <div class="session-row">
      <span class="session-label"><i class="bi bi-shield-check"></i>الصلاحية</span>
      <span class="session-val">مدير النظام</span>
    </div>
    <div class="session-row">
      <span class="session-label"><i class="bi bi-clock"></i>مدة الجلسة</span>
      <span class="session-val" id="sessionDuration">—</span>
    </div>
  </div>

  <!-- الأزرار -->
  <button class="btn-confirm" id="confirmBtn" onclick="doLogout()">
    <div class="spinner" id="logoutSpinner"></div>
    <i class="bi bi-box-arrow-left" id="logoutIcon"></i>
    <span id="logoutText">نعم، تسجيل الخروج</span>
  </button>

  <button class="btn-cancel" onclick="goBack()">
    <i class="bi bi-arrow-right"></i>
    رجوع إلى لوحة التحكم
  </button>

  <div class="footer-note">
    <i class="bi bi-shield-lock me-1"></i>
    جلستك محمية — بياناتك آمنة
  </div>
</div>

<!-- شاشة التأكيد بعد الخروج -->
<div class="done-overlay" id="doneOverlay">
  <div class="done-circle"><i class="bi bi-check-lg"></i></div>
  <div class="done-title">تم تسجيل الخروج بنجاح</div>
  <div class="done-sub">جاري التحويل إلى صفحة الدخول...</div>
</div>

<script>
  // ── حساب مدة الجلسة ──
  window.addEventListener('DOMContentLoaded', () => {
    // اسم المستخدم
    const savedUser = localStorage.getItem('elawaady_user') || sessionStorage.getItem('elawaady_user') || 'admin@elawaady.com';
    const username = savedUser.split('@')[0];
    document.getElementById('userName').textContent = username;
    document.getElementById('sessionUser').textContent = savedUser;

    // وقت الجلسة التقديري
    const loginTime = parseInt(localStorage.getItem('elawaady_login_time') || sessionStorage.getItem('elawaady_login_time') || Date.now());
    const elapsed = Math.floor((Date.now() - loginTime) / 60000); // دقائق
    if (elapsed < 1) {
      document.getElementById('sessionDuration').textContent = 'أقل من دقيقة';
    } else if (elapsed < 60) {
      document.getElementById('sessionDuration').textContent = elapsed + ' دقيقة';
    } else {
      const hrs = Math.floor(elapsed / 60);
      const mins = elapsed % 60;
      document.getElementById('sessionDuration').textContent = hrs + 'س ' + (mins > 0 ? mins + 'د' : '');
    }
  });

  // ── تسجيل الخروج الفعلي ──
  function doLogout() {
    const btn     = document.getElementById('confirmBtn');
    const spinner = document.getElementById('logoutSpinner');
    const icon    = document.getElementById('logoutIcon');
    const text    = document.getElementById('logoutText');

    btn.disabled = true;
    spinner.style.display = 'block';
    icon.style.display    = 'none';
    text.textContent      = 'جاري الخروج...';

    setTimeout(() => {
      // مسح بيانات الجلسة
      localStorage.removeItem('elawaady_logged_in');
      localStorage.removeItem('elawaady_user');
      localStorage.removeItem('elawaady_login_time');
      sessionStorage.removeItem('elawaady_logged_in');
      sessionStorage.removeItem('elawaady_user');
      sessionStorage.removeItem('elawaady_login_time');

      // إظهار شاشة النجاح
      document.getElementById('doneOverlay').classList.add('show');

      // التحويل لصفحة الدخول
      setTimeout(() => { window.location.href = './login.html'; }, 1400);
    }, 900);
  }

  // ── الرجوع للداشبورد ──
  function goBack() {
    if (document.referrer && !document.referrer.includes('login')) {
      history.back();
    } else {
      window.location.href = './index.html';
    }
  }

  // ── Escape يرجع ──
  document.addEventListener('keydown', e => { if (e.key === 'Escape') goBack(); });
</script>
</body>
</html>
