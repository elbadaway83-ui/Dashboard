<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الخروج | Admin — Elawaady</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/style.css">
  <meta name="robots" content="noindex,nofollow">
  <style>
    /* Same animated background as login */
    .login-bg {
      position: fixed;
      inset: 0;
      background: var(--bg);
      overflow: hidden;
      z-index: 0;
    }

    .login-bg::before {
      content: '';
      position: absolute;
      width: 600px;
      height: 600px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(239, 68, 68, .08) 0%, transparent 70%);
      top: -100px;
      right: -100px;
      animation: floatBg 8s ease-in-out infinite;
    }

    .login-bg::after {
      content: '';
      position: absolute;
      width: 400px;
      height: 400px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(240, 165, 0, .06) 0%, transparent 70%);
      bottom: -80px;
      left: -80px;
      animation: floatBg 10s ease-in-out infinite reverse;
    }

    @keyframes floatBg {

      0%,
      100% {
        transform: translate(0, 0) scale(1);
      }

      50% {
        transform: translate(30px, 30px) scale(1.05);
      }
    }

    .grid-lines {
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(240, 165, 0, .03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(240, 165, 0, .03) 1px, transparent 1px);
      background-size: 40px 40px;
      z-index: 0;
    }

    /* Logout page */
    .logout-page {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .logout-box {
      background: rgba(30, 30, 30, .85);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(239, 68, 68, .2);
      border-radius: 20px;
      padding: 48px 40px;
      width: 100%;
      max-width: 420px;
      text-align: center;
      box-shadow: 0 0 60px rgba(239, 68, 68, .06), 0 20px 60px rgba(0, 0, 0, .5);
      animation: fadeUp .4s ease;
    }

    .logout-icon-wrap {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: linear-gradient(135deg, rgba(239, 68, 68, .15), rgba(239, 68, 68, .05));
      border: 2px solid rgba(239, 68, 68, .25);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 42px;
      margin: 0 auto 20px;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {

      0%,
      100% {
        box-shadow: 0 0 0 0 rgba(239, 68, 68, .2);
      }

      50% {
        box-shadow: 0 0 0 12px rgba(239, 68, 68, .0);
      }
    }

    .logout-title {
      font-size: 22px;
      font-weight: 800;
      color: var(--text);
      margin-bottom: 8px;
    }

    .logout-sub {
      font-size: 13px;
      color: var(--text2);
      line-height: 1.6;
      margin-bottom: 28px;
    }

    .logout-divider {
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(239, 68, 68, .3), transparent);
      margin: 20px 0;
    }

    /* Countdown ring */
    .countdown-wrap {
      margin: 0 auto 24px;
      width: 70px;
      height: 70px;
      position: relative;
    }

    .countdown-ring {
      width: 70px;
      height: 70px;
      transform: rotate(-90deg);
    }

    .countdown-ring circle {
      fill: none;
      stroke-width: 4;
    }

    .countdown-ring .bg-ring {
      stroke: rgba(255, 255, 255, .06);
    }

    .countdown-ring .progress-ring {
      stroke: var(--red);
      stroke-dasharray: 188;
      stroke-dashoffset: 0;
      stroke-linecap: round;
      transition: stroke-dashoffset 1s linear;
    }

    .countdown-number {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 22px;
      font-weight: 800;
      color: var(--red);
    }

    /* Buttons */
    .logout-actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .btn-logout-confirm {
      width: 100%;
      padding: 12px;
      font-size: 15px;
      font-weight: 700;
      border-radius: 10px;
      background: linear-gradient(135deg, #ef4444, #dc2626);
      color: #fff;
      border: none;
      font-family: var(--font);
      cursor: pointer;
      transition: all .25s;
      box-shadow: 0 4px 20px rgba(239, 68, 68, .3);
    }

    .btn-logout-confirm:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 28px rgba(239, 68, 68, .4);
    }

    .btn-logout-confirm:active {
      transform: translateY(0);
    }

    .btn-cancel {
      width: 100%;
      padding: 11px;
      font-size: 14px;
      font-weight: 600;
      border-radius: 10px;
      background: var(--bg3);
      color: var(--text2);
      border: 1px solid var(--border);
      font-family: var(--font);
      cursor: pointer;
      transition: all .25s;
    }

    .btn-cancel:hover {
      border-color: var(--gold);
      color: var(--gold);
    }

    /* Success state */
    .logout-success {
      display: none;
    }

    .logout-success.show {
      display: block;
    }

    .logout-form {
      display: block;
    }

    .logout-form.hide {
      display: none;
    }

    /* Brand tag */
    .logout-brand {
      margin-top: 24px;
      font-size: 11px;
      color: var(--text2);
    }

    .logout-brand span {
      color: var(--gold);
      font-weight: 700;
    }
  </style>
</head>

<body>

  <div class="login-bg"></div>
  <div class="grid-lines"></div>

  <div class="logout-page">
    <div class="logout-box fade-up">

      <!-- Confirm Logout -->
      <div class="logout-form" id="logout-form">
        <div class="logout-icon-wrap"
          style="width:auto;height:auto;background:none;border:none;animation:none;padding:0;">
          <img src="../assets/images/admin-logo.png" alt="Elawaady"
            style="height:90px;object-fit:contain;filter:drop-shadow(0 0 20px rgba(240,165,0,.35));"
            onerror="this.outerHTML='<div class=\'logout-icon-wrap\'>🚪</div>';">
        </div>
        <div class="logout-title">تسجيل الخروج</div>
        <div class="logout-sub">هل أنت متأكد أنك تريد الخروج من لوحة التحكم؟<br>سيتم إنهاء جلستك الحالية.</div>

        <div class="logout-divider"></div>

        <!-- Countdown -->
        <div style="font-size:12px;color:var(--text2);margin-bottom:10px;">سيتم الخروج تلقائيًا خلال</div>
        <div class="countdown-wrap">
          <svg class="countdown-ring" viewBox="0 0 70 70">
            <circle class="bg-ring" cx="35" cy="35" r="30"></circle>
            <circle class="progress-ring" id="progress-ring" cx="35" cy="35" r="30"></circle>
          </svg>
          <div class="countdown-number" id="countdown-num">5</div>
        </div>

        <div class="logout-actions">
          <button class="btn-logout-confirm" id="confirm-btn" onclick="doLogout()">
            🚪 نعم، سجّل خروجي
          </button>
          <button class="btn-cancel" onclick="cancelLogout()">
            ← إلغاء والعودة للوحة
          </button>
        </div>

        <div class="logout-brand">نظام إدارة <span>Elawaady</span></div>
      </div>

      <!-- Success State -->
      <div class="logout-success" id="logout-success">
        <div class="logout-icon-wrap"
          style="border-color:rgba(34,197,94,.25);background:linear-gradient(135deg,rgba(34,197,94,.15),rgba(34,197,94,.05));animation:none;">
          ✅</div>
        <div class="logout-title" style="color:var(--green);">تم تسجيل الخروج</div>
        <div class="logout-sub">تم إنهاء جلستك بنجاح.<br>سيتم توجيهك لصفحة تسجيل الدخول...</div>
        <div style="margin-top:16px;">
          <div style="height:3px;background:var(--bg3);border-radius:3px;overflow:hidden;">
            <div id="redirect-bar"
              style="height:100%;width:0%;background:var(--green);border-radius:3px;transition:width 2s linear;"></div>
          </div>
        </div>
        <a href="login.html" class="btn btn-secondary" style="margin-top:16px;display:inline-flex;">🔐 الذهاب لتسجيل
          الدخول</a>
      </div>

    </div>
  </div>

  <div id="toast-container" class="toast-container"></div>
  <script src="../assets/script/script.js"></script>
  <script>
    const TOTAL = 5;
    let remaining = TOTAL;
    let timer = null;
    let cancelled = false;

    const circumference = 2 * Math.PI * 30; // ≈ 188.5
    const ring = document.getElementById('progress-ring');
    ring.style.strokeDasharray = circumference;
    ring.style.strokeDashoffset = 0;

    function setRing(value) {
      // value: 0 = full, 1 = empty
      ring.style.strokeDashoffset = circumference * value;
    }

    function startCountdown() {
      setRing(0);
      timer = setInterval(() => {
        if (cancelled) { clearInterval(timer); return; }
        remaining--;
        document.getElementById('countdown-num').textContent = remaining;
        setRing((TOTAL - remaining) / TOTAL);
        if (remaining <= 0) {
          clearInterval(timer);
          doLogout();
        }
      }, 1000);
    }

    function doLogout() {
      cancelled = true;
      clearInterval(timer);
      document.getElementById('logout-form').classList.add('hide');
      document.getElementById('logout-success').classList.add('show');
      // Animate redirect bar
      setTimeout(() => {
        document.getElementById('redirect-bar').style.width = '100%';
      }, 100);
      // Redirect after 2s
      setTimeout(() => {
        location.href = 'login.html';
      }, 2200);
    }

    function cancelLogout() {
      cancelled = true;
      clearInterval(timer);
      showToast('تم إلغاء تسجيل الخروج', 'info');
      setTimeout(() => { history.back(); }, 800);
    }

    // Start countdown on load
    startCountdown();
  </script>
</body>

</html>
