<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الخروج — Elawaady</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/pages.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --brand: #4f46e5;
      --brand-dark: #3730a3;
      --brand-light: #eef2ff;
      --brand-mid: #c7d2fe;
      --red: #dc2626;
      --red-light: #fef2f2;
      --surface: #ffffff;
      --surface-2: #f8fafc;
      --surface-3: #f1f5f9;
      --border: #e2e8f0;
      --border-2: #cbd5e1;
      --text-1: #0f172a;
      --text-2: #475569;
      --text-3: #94a3b8;
      --radius: 14px;
      --radius-sm: 10px;
      --t-fast: .14s ease;
      --t-base: .22s ease;
    }
    body {
      font-family: 'Cairo', sans-serif;
      background: var(--surface-2);
      color: var(--text-1);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      direction: rtl;
    }
    .logout-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 48px 40px;
      width: min(92vw, 440px);
      text-align: center;
      animation: cardIn .3s cubic-bezier(.34,1.56,.64,1);
    }
    @keyframes cardIn {
      from { opacity: 0; transform: scale(.9) translateY(24px); }
      to   { opacity: 1; transform: scale(1) translateY(0); }
    }
    .logo-wrap {
      width: 72px;
      height: 72px;
      border-radius: 20px;
      background: linear-gradient(135deg, var(--brand), var(--brand-dark));
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 2rem;
      margin: 0 auto 24px;
    }
    .logout-title {
      font-size: 1.4rem;
      font-weight: 900;
      color: var(--text-1);
      margin-bottom: 10px;
    }
    .logout-sub {
      font-size: .88rem;
      color: var(--text-3);
      line-height: 1.6;
      margin-bottom: 32px;
    }
    .admin-info {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 14px 16px;
      margin-bottom: 28px;
      text-align: right;
    }
    .admin-avatar {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--brand), #818cf8);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 900;
      font-size: 1rem;
      flex-shrink: 0;
    }
    .admin-name { font-size: .9rem; font-weight: 700; color: var(--text-1); }
    .admin-role { font-size: .75rem; color: var(--text-3); margin-top: 2px; }
    .btn-logout {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 13px;
      border-radius: var(--radius-sm);
      background: var(--red);
      color: white;
      font-family: 'Cairo', sans-serif;
      font-size: .92rem;
      font-weight: 700;
      border: none;
      cursor: pointer;
      transition: all var(--t-base);
      margin-bottom: 12px;
    }
    .btn-logout:hover { background: #b91c1c; transform: translateY(-2px); }
    .btn-logout:active { transform: scale(.97); }
    .btn-cancel {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 13px;
      border-radius: var(--radius-sm);
      background: var(--surface-3);
      color: var(--text-2);
      font-family: 'Cairo', sans-serif;
      font-size: .92rem;
      font-weight: 700;
      border: 1px solid var(--border);
      cursor: pointer;
      transition: all var(--t-fast);
      text-decoration: none;
    }
    .btn-cancel:hover { background: var(--brand-light); border-color: var(--brand-mid); color: var(--brand); }

    /* Loading state */
    .loading-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(248,250,252,.9);
      backdrop-filter: blur(4px);
      z-index: 100;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 16px;
    }
    .loading-overlay.show { display: flex; }
    .spinner {
      width: 48px;
      height: 48px;
      border: 3px solid var(--border);
      border-top-color: var(--brand);
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { font-size: .9rem; font-weight: 700; color: var(--text-2); }

    /* Success state */
    .success-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(248,250,252,.9);
      backdrop-filter: blur(4px);
      z-index: 100;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 16px;
    }
    .success-overlay.show { display: flex; }
    .success-icon {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: #d1fae5;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      color: #059669;
      animation: popIn .4s cubic-bezier(.34,1.56,.64,1);
    }
    @keyframes popIn {
      from { transform: scale(0); }
      to   { transform: scale(1); }
    }
    .success-text { font-size: 1rem; font-weight: 800; color: var(--text-1); }
    .success-sub  { font-size: .82rem; color: var(--text-3); }
  </style>
</head>
<body>

  <div class="logout-card">
    <div class="logo-wrap">
      <i class="bi bi-box-arrow-right"></i>
    </div>
    <div class="logout-title">هل تريد تسجيل الخروج؟</div>
    <div class="logout-sub">سيتم إنهاء جلستك الحالية وستحتاج إلى تسجيل الدخول مجدداً للوصول للوحة التحكم</div>

    <div class="admin-info">
      <div class="admin-avatar">أ</div>
      <div>
        <div class="admin-name">Ahmed El-zaghawy</div>
        <div class="admin-role">مدير النظام — Elawaady</div>
      </div>
    </div>

    <button class="btn-logout" onclick="doLogout()">
      <i class="bi bi-box-arrow-right"></i>
      نعم، تسجيل الخروج
    </button>
    <a href="../index.html" class="btn-cancel">
      <i class="bi bi-arrow-right"></i>
      لا، العودة للوحة التحكم
    </a>
  </div>

  <!-- Loading overlay -->
  <div class="loading-overlay" id="loadingOverlay">
    <div class="spinner"></div>
    <div class="loading-text">جارٍ تسجيل الخروج...</div>
  </div>

  <!-- Success overlay -->
  <div class="success-overlay" id="successOverlay">
    <div class="success-icon"><i class="bi bi-check-lg"></i></div>
    <div class="success-text">تم تسجيل الخروج بنجاح</div>
    <div class="success-sub">يتم تحويلك لصفحة تسجيل الدخول...</div>
  </div>

  <script>
    function doLogout() {
      document.getElementById('loadingOverlay').classList.add('show');
      setTimeout(() => {
        document.getElementById('loadingOverlay').classList.remove('show');
        document.getElementById('successOverlay').classList.add('show');
        // Clear session/auth data
        localStorage.removeItem('elawaady_token');
        localStorage.removeItem('elawaady_user');
        sessionStorage.clear();
        // Redirect after 1.5s
        setTimeout(() => {
          window.location.href = '../login.html';
        }, 1500);
      }, 1200);
    }
  </script>
</body>
</html>
