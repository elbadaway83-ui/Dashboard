<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>روابط التواصل الاجتماعي — Elawaady</title>
  <meta name="description" content="تعديل روابط صفحات التواصل الاجتماعي والجروبات">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../assets/css/style.css">
  <style>
    body { padding: 28px; background: var(--surface-2); }
    .main-content { max-width: 1000px; margin: 0 auto; animation: fadeInUp .4s ease-out; }
    @keyframes fadeInUp { from { opacity:0; transform:translateY(14px); } to { opacity:1; transform:translateY(0); } }
    .social-input-wrap {
      position: relative;
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }
    .social-icon-badge {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      flex-shrink: 0;
    }
  </style>
</head>
<body>

<main class="main-content">
  <div class="page-header">
    <h1 class="page-title"><i class="bi bi-link-45deg me-2 text-primary"></i>روابط التواصل الاجتماعي</h1>
    <p class="page-subtitle">تعديل لينكات الصفحات والجروبات التي تظهر للعملاء</p>
  </div>

  <div class="row g-3">
    <!-- مواقع التواصل -->
    <div class="col-md-7">
      <div class="card p-4">
        <div style="font-size:.88rem;font-weight:800;color:var(--text-1);margin-bottom:20px;display:flex;align-items:center;gap:8px">
          <i class="bi bi-globe text-primary"></i>صفحات التواصل الاجتماعي
        </div>

        <form>
          <div class="social-input-wrap">
            <div class="social-icon-badge" style="background:#e7f3ff;color:#1877f2"><i class="bi bi-facebook"></i></div>
            <div class="flex-grow-1">
              <label class="form-label" style="margin-bottom:5px">فيسبوك (Facebook Page)</label>
              <input type="url" class="form-input" placeholder="https://facebook.com/yourpage" style="height:38px">
            </div>
          </div>

          <div class="social-input-wrap">
            <div class="social-icon-badge" style="background:#e6f4ea;color:#25d366"><i class="bi bi-whatsapp"></i></div>
            <div class="flex-grow-1">
              <label class="form-label" style="margin-bottom:5px">واتساب (WhatsApp Support)</label>
              <input type="url" class="form-input" placeholder="https://wa.me/201xxxxxxxxx" style="height:38px">
            </div>
          </div>

          <div class="social-input-wrap">
            <div class="social-icon-badge" style="background:#e8f4fd;color:#0088cc"><i class="bi bi-telegram"></i></div>
            <div class="flex-grow-1">
              <label class="form-label" style="margin-bottom:5px">تليجرام (Telegram Channel)</label>
              <input type="url" class="form-input" placeholder="https://t.me/yourchannel" style="height:38px">
            </div>
          </div>

          <div class="social-input-wrap">
            <div class="social-icon-badge" style="background:#fcf3e3;color:#e1306c"><i class="bi bi-instagram"></i></div>
            <div class="flex-grow-1">
              <label class="form-label" style="margin-bottom:5px">انستقرام (Instagram)</label>
              <input type="url" class="form-input" placeholder="https://instagram.com/yourpage" style="height:38px">
            </div>
          </div>

          <div class="social-input-wrap">
            <div class="social-icon-badge" style="background:#f3e6ff;color:#7c3aed"><i class="bi bi-tiktok"></i></div>
            <div class="flex-grow-1">
              <label class="form-label" style="margin-bottom:5px">تيك توك (TikTok)</label>
              <input type="url" class="form-input" placeholder="https://tiktok.com/@yourpage" style="height:38px">
            </div>
          </div>

          <div class="social-input-wrap" style="margin-bottom:0">
            <div class="social-icon-badge" style="background:#e0f2fe;color:#0891b2"><i class="bi bi-youtube" style="color:#ff0000"></i></div>
            <div class="flex-grow-1">
              <label class="form-label" style="margin-bottom:5px">يوتيوب (YouTube)</label>
              <input type="url" class="form-input" placeholder="https://youtube.com/@yourchannel" style="height:38px">
            </div>
          </div>

          <div style="height:1px;background:var(--border);margin:20px 0"></div>

          <button type="submit" class="btn-primary w-100"><i class="bi bi-floppy me-2"></i>حفظ جميع الروابط</button>
        </form>
      </div>
    </div>

    <!-- Preview side -->
    <div class="col-md-5">
      <!-- Facebook groups -->
      <div class="card p-4 mb-3">
        <div style="font-size:.88rem;font-weight:800;color:var(--text-1);margin-bottom:16px;display:flex;align-items:center;gap:8px">
          <i class="bi bi-people-fill" style="color:#1877f2"></i>جروبات فيسبوك
        </div>

        <div class="social-input-wrap" style="margin-bottom:12px">
          <div class="social-icon-badge" style="background:#e7f3ff;color:#1877f2"><i class="bi bi-people-fill"></i></div>
          <div class="flex-grow-1">
            <label class="form-label" style="margin-bottom:5px">الجروب الرئيسي</label>
            <input type="url" class="form-input" placeholder="https://facebook.com/groups/..." style="height:38px">
          </div>
        </div>

        <div class="social-input-wrap" style="margin-bottom:0">
          <div class="social-icon-badge" style="background:#e0e7ff;color:var(--brand)"><i class="bi bi-people"></i></div>
          <div class="flex-grow-1">
            <label class="form-label" style="margin-bottom:5px">جروب فرعي (Deal Room)</label>
            <input type="url" class="form-input" placeholder="https://facebook.com/groups/..." style="height:38px">
          </div>
        </div>
      </div>

      <!-- Preview widget -->
      <div class="card p-4">
        <div style="font-size:.88rem;font-weight:800;color:var(--text-1);margin-bottom:16px;display:flex;align-items:center;gap:8px">
          <i class="bi bi-eye text-success"></i>معاينة الأيقونات
        </div>
        <div style="font-size:.78rem;color:var(--text-3);margin-bottom:14px">هكذا ستظهر أيقونات التواصل للعملاء في الواجهة الأمامية</div>

        <div class="d-flex gap-3 flex-wrap justify-content-center">
          <div style="width:46px;height:46px;border-radius:12px;background:#e7f3ff;color:#1877f2;display:flex;align-items:center;justify-content:center;font-size:1.3rem;cursor:pointer;transition:all .2s" onmouseenter="this.style.transform='scale(1.1)'" onmouseleave="this.style.transform=''"><i class="bi bi-facebook"></i></div>
          <div style="width:46px;height:46px;border-radius:12px;background:#e6f4ea;color:#25d366;display:flex;align-items:center;justify-content:center;font-size:1.3rem;cursor:pointer;transition:all .2s" onmouseenter="this.style.transform='scale(1.1)'" onmouseleave="this.style.transform=''"><i class="bi bi-whatsapp"></i></div>
          <div style="width:46px;height:46px;border-radius:12px;background:#e8f4fd;color:#0088cc;display:flex;align-items:center;justify-content:center;font-size:1.3rem;cursor:pointer;transition:all .2s" onmouseenter="this.style.transform='scale(1.1)'" onmouseleave="this.style.transform=''"><i class="bi bi-telegram"></i></div>
          <div style="width:46px;height:46px;border-radius:12px;background:#fcf3e3;color:#e1306c;display:flex;align-items:center;justify-content:center;font-size:1.3rem;cursor:pointer;transition:all .2s" onmouseenter="this.style.transform='scale(1.1)'" onmouseleave="this.style.transform=''"><i class="bi bi-instagram"></i></div>
          <div style="width:46px;height:46px;border-radius:12px;background:#f3e6ff;color:#7c3aed;display:flex;align-items:center;justify-content:center;font-size:1.3rem;cursor:pointer;transition:all .2s" onmouseenter="this.style.transform='scale(1.1)'" onmouseleave="this.style.transform=''"><i class="bi bi-tiktok"></i></div>
          <div style="width:46px;height:46px;border-radius:12px;background:#ffe0e0;color:#ff0000;display:flex;align-items:center;justify-content:center;font-size:1.3rem;cursor:pointer;transition:all .2s" onmouseenter="this.style.transform='scale(1.1)'" onmouseleave="this.style.transform=''"><i class="bi bi-youtube"></i></div>
        </div>
      </div>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
